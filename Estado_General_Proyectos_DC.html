<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estado General de Proyectos DC — Syntesys Tecnológica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --black:#141414;
  --charcoal:#2b2b2b;
  --yellow:#F6D500;
  --yellow-dark:#D9BA00;
  --paper:#FAFAF6;
  --white:#ffffff;
  --line:#E4E1D6;
  --muted:#6b6b63;
  --danger:#B3352A;
  --danger-bg:#FBEAE8;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:'Inter', -apple-system, sans-serif;
  background:var(--paper);
  color:var(--black);
  -webkit-font-smoothing:antialiased;
}
#root{ min-height:100vh; }
h1,h2,h3{ font-family:'Space Grotesk', 'Inter', sans-serif; margin:0; }
button{ font-family:inherit; cursor:pointer; }
a{ color:var(--black); }

/* ---------- Loading ---------- */
.loading-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  color:var(--muted);
}
.loading-logo{ width:64px; height:64px; object-fit:contain; }

/* ---------- Auth ---------- */
.auth-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    linear-gradient(180deg, var(--black) 0%, var(--black) 220px, var(--paper) 220px);
  padding:24px;
}
.auth-card{
  width:100%; max-width:400px; background:var(--white); border:1px solid var(--line);
  padding:36px 32px 28px; position:relative; margin-top:40px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.18);
}
.auth-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--yellow);
}
.auth-logo{ display:flex; justify-content:center; margin-bottom:8px; margin-top:-64px; }
.auth-logo img{ width:96px; height:96px; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
.auth-title{ font-size:20px; font-weight:700; text-align:center; letter-spacing:-0.01em; }
.auth-subtitle{ text-align:center; color:var(--muted); font-size:13px; margin:6px 0 24px; }
.auth-form{ display:flex; flex-direction:column; gap:4px; }
.field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--charcoal); margin-top:14px; margin-bottom:6px; }
.auth-links{ display:flex; justify-content:space-between; margin-top:16px; font-size:13px; }
.auth-links a{ text-decoration:none; color:var(--charcoal); border-bottom:1px solid var(--line); }
.auth-links a:hover{ color:var(--black); border-color:var(--black); }
.auth-hint{ margin-top:20px; font-size:12px; color:var(--muted); text-align:center; line-height:1.6; }
.auth-note{ font-size:13px; color:var(--muted); line-height:1.5; }
.auth-error{ background:var(--danger-bg); color:var(--danger); font-size:13px; padding:10px 12px; border-left:3px solid var(--danger); margin-bottom:4px; }
.auth-simulated-email{ background:#FFFBE0; border:1px dashed var(--yellow-dark); padding:14px 16px; margin-bottom:16px; }
.auth-simulated-email-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--charcoal); font-weight:700; }
.auth-simulated-email-code{ font-family:'Space Grotesk',monospace; font-size:28px; font-weight:700; letter-spacing:.1em; margin:6px 0; }
.auth-simulated-email p{ font-size:12px; color:var(--muted); margin:6px 0 0; line-height:1.5; }

/* ---------- Inputs / buttons ---------- */
.text-input, select, input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], textarea{
  width:100%; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--black);
  background:var(--white); border:1px solid var(--line); outline:none;
}
.text-input:focus, select:focus, textarea:focus, input:focus{ border-color:var(--black); }
textarea{ resize:vertical; }

.btn{ border:none; padding:10px 18px; font-size:13px; font-weight:600; letter-spacing:.01em; transition:background .15s, color .15s, border-color .15s; }
.btn-block{ width:100%; margin-top:20px; }
.btn-primary{ background:var(--black); color:var(--yellow); }
.btn-primary:hover{ background:var(--charcoal); }
.btn-outline{ background:var(--white); color:var(--black); border:1px solid var(--black); }
.btn-outline:hover{ background:var(--black); color:var(--yellow); }
.btn-ghost-yellow{ background:transparent; color:var(--yellow); border:1px solid var(--yellow); }
.btn-ghost-yellow:hover{ background:var(--yellow); color:var(--black); }
.btn-text{ background:transparent; color:var(--charcoal); padding:6px 8px; text-decoration:underline; text-underline-offset:2px; }
.btn-text-danger{ color:var(--danger); }
.btn-danger{ background:var(--danger); color:var(--white); }

/* ---------- App shell ---------- */
.app-shell{ min-height:100vh; display:flex; flex-direction:column; }
.topbar{
  background:var(--black); color:var(--white); display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px; border-bottom:4px solid var(--yellow);
}
.topbar-left{ display:flex; align-items:center; gap:14px; }
.topbar-logo{ width:40px; height:40px; object-fit:contain; }
.topbar-title{ display:flex; flex-direction:column; line-height:1.2; }
.topbar-title-main{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; letter-spacing:.02em; }
.topbar-title-sub{ font-size:11px; color:#c9c9c9; }
.topbar-right{ display:flex; align-items:center; gap:16px; }
.topbar-user{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.3; }
.topbar-user-name{ font-size:13px; font-weight:600; }
.topbar-user-email{ font-size:11px; color:#a8a8a8; }

.app-body{ flex:1; max-width:1240px; margin:0 auto; width:100%; padding:0 28px 60px; }

.tabs{ display:flex; gap:4px; margin-top:20px; border-bottom:1px solid var(--line); }
.tab-btn{ background:transparent; border:none; padding:12px 6px; margin-right:22px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; }
.tab-btn.active{ color:var(--black); border-bottom-color:var(--yellow); }
.tab-btn:hover{ color:var(--black); }

.tab-content{ padding-top:24px; }
.panel{ display:flex; flex-direction:column; gap:24px; }

/* ---------- KPIs ---------- */
.kpi-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
.kpi-card{
  background:var(--white); border:1px solid var(--line); border-left:4px solid var(--yellow);
  padding:16px 18px;
}
.kpi-card-hero{
  grid-column:span 4; background:var(--black); color:var(--white); border-left:4px solid var(--yellow);
  display:flex; flex-direction:column; gap:2px; padding:22px 24px;
}
.kpi-hero-value{ font-family:'Space Grotesk', sans-serif; font-size:42px; font-weight:700; color:var(--yellow); }
.kpi-hero-label{ font-size:14px; font-weight:600; }
.kpi-hero-sub{ font-size:12px; color:#c9c9c9; margin-top:2px; }
.kpi-count{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; }
.kpi-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:4px; }

@media (max-width: 900px){
  .kpi-grid{ grid-template-columns:repeat(2, 1fr); }
  .kpi-card-hero{ grid-column:span 2; }
}

/* ---------- Panels / charts ---------- */
.panel-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.chart-box{ background:var(--white); border:1px solid var(--line); padding:18px 20px 8px; }
.chart-box-wide{ grid-column:1 / -1; }
.chart-title{ font-size:14px; font-weight:700; margin-bottom:12px; }

@media (max-width: 900px){
  .panel-row{ grid-template-columns:1fr; }
}

.mini-log{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; max-height:240px; overflow-y:auto; }
.mini-log li{ font-size:12.5px; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); padding-bottom:8px; }
.mini-log-user{ font-weight:700; }
.mini-log-text{ color:var(--charcoal); flex:1; }
.mini-log-time{ color:var(--muted); font-size:11px; width:100%; }
.mini-log-empty{ color:var(--muted); }

/* ---------- Toolbar / filters ---------- */
.toolbar{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.toolbar-left{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.toolbar-right{ display:flex; gap:10px; }
.search-input{ min-width:260px; }
.toolbar select{ width:auto; min-width:150px; }

.status-chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.status-chip{
  background:var(--white); border:1px solid var(--line); border-left:4px solid var(--chip-color);
  padding:6px 12px; font-size:12px; font-weight:600; color:var(--charcoal);
}
.status-chip.active{ background:var(--black); color:var(--white); border-color:var(--black); border-left:4px solid var(--chip-color); }
.status-chip-count{ color:var(--muted); font-weight:400; }
.status-chip.active .status-chip-count{ color:#bbb; }

/* ---------- Table ---------- */
.table-wrap{ overflow-x:auto; border:1px solid var(--line); background:var(--white); }
.data-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:900px; }
.data-table thead th{
  text-align:left; padding:10px 14px; background:var(--paper); border-bottom:2px solid var(--black);
  font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--charcoal); white-space:nowrap;
}
.data-table tbody td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
.data-table tbody tr:hover{ background:#FDFBEF; }
.cell-strong{ font-weight:700; }
.cell-sub{ color:var(--muted); font-size:12px; }
.cell-actions{ white-space:nowrap; text-align:right; }
.empty-row{ text-align:center; color:var(--muted); padding:32px !important; }
.table-footnote{ font-size:12px; color:var(--muted); margin-top:8px; }

.status-pill{
  display:inline-block; padding:4px 10px; font-size:11px; font-weight:700; color:var(--white);
  background:var(--chip-color); white-space:nowrap;
}

.progress-track{ background:var(--line); height:6px; width:100px; position:relative; overflow:hidden; }
.progress-track-lg{ width:220px; height:10px; }
.progress-fill{ background:var(--yellow-dark); height:100%; }
.progress-label{ font-size:11px; color:var(--muted); display:block; margin-top:3px; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,20,20,.6); display:flex; align-items:flex-start; justify-content:center;
  padding:40px 20px; overflow-y:auto; z-index:50;
}
.modal-card{ background:var(--white); width:100%; max-width:720px; max-height:calc(100vh - 80px); display:flex; flex-direction:column; box-shadow:0 30px 60px rgba(0,0,0,.35); }
.modal-card-sm{ max-width:440px; max-height:none; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line); }
.modal-header h2{ font-size:16px; }
.modal-close{ background:none; border:none; font-size:16px; color:var(--muted); }
.modal-close:hover{ color:var(--black); }
.modal-form{ padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; }
.modal-footer{ display:flex; justify-content:flex-end; gap:10px; padding-top:8px; border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--white); }

.form-section{ border:none; padding:0; margin:0; }
.form-section legend{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--charcoal); padding:0 0 10px; width:100%; border-bottom:1px solid var(--line); margin-bottom:12px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
.field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
.field-wide{ grid-column:1 / -1; }

@media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }

.progress-editor{ display:flex; flex-direction:column; gap:14px; }
.progress-editor-row{ display:grid; grid-template-columns:90px 1fr 72px; align-items:center; gap:12px; }
.progress-editor-row label{ font-size:13px; font-weight:600; }
.progress-editor-value{ font-size:13px; font-weight:700; text-align:right; }
.progress-editor-total{ display:grid; grid-template-columns:90px 1fr 72px; align-items:center; gap:12px; padding-top:8px; border-top:1px dashed var(--line); }
.progress-editor-total label{ font-size:13px; font-weight:700; }
.progress-editor-number-wrap{ display:flex; align-items:center; justify-content:flex-end; gap:4px; }
.progress-editor-number{ width:52px; padding:5px 6px; text-align:right; font-size:13px; font-weight:700; }
.progress-editor-number-wrap span{ font-size:13px; font-weight:700; color:var(--charcoal); }
input[type=range]{ accent-color:var(--black); }

</style>

function simpleHash(str){
  let h = 5381;
  for (let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function esc(s){
  if (s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(v){
  if (!v) return '—';
  if (/^\d{4}-\d{2}-\d{2}/.test(String(v))){
    const [y,m,d] = String(v).slice(0,10).split('-');
    return `${d}/${m}/${y}`;
  }
  return esc(v);
}
function fmtDateTime(v){
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return esc(v);
  return d.toLocaleString('es-CO', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function computeAvance(p){
  const t = Number(p.tuberia)||0, c = Number(p.cableado)||0, e = Number(p.equipos)||0;
  return Math.round((t+c+e)/3);
}

/* ---------- Utilidades para las métricas semanales de "Análisis" ---------- */
function parseValidDate(v){
  if (!v) return null;
  const s = String(v).trim();
  if (!/^\d{4}-\d{2}-\d{2}/.test(s)) return null; // descarta null, "N/A", "00:00:00", etc.
  const d = new Date(s.slice(0,10) + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  if (d.getFullYear() < 2000 || d.getFullYear() > 2100) return null; // descarta fechas centinela (ej. 1900-12-31)
  return d;
}
function getWeekStart(date){
  const d = new Date(date);
  const day = d.getDay(); // 0=domingo … 6=sábado
  const diff = (day === 0 ? -6 : 1 - day); // la semana inicia el lunes
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}
function weekKey(d){
  return d.toISOString().slice(0,10);
}
function weekLabel(monday){
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const fmt = x => `${String(x.getDate()).padStart(2,'0')}/${String(x.getMonth()+1).padStart(2,'0')}`;
  return `${fmt(monday)}–${fmt(sunday)}`;
}
/**
 * Agrupa los proyectos en semanas (lunes a domingo) según el campo de fecha indicado.
 * Devuelve { weeks:[{key,monday,label,items:[...]}], withoutDate: n }
 */
function buildWeeklyBuckets(field, maxWeeks){
  const withDate = projects
    .map(p => ({ p, d: parseValidDate(p[field]) }))
    .filter(x => x.d);

  if (!withDate.length){
    return { weeks: [], withoutDate: projects.length };
  }

  const buckets = new Map();
  withDate.forEach(({p,d}) => {
    const monday = getWeekStart(d);
    const key = weekKey(monday);
    if (!buckets.has(key)) buckets.set(key, { key, monday, items: [] });
    buckets.get(key).items.push(p);
  });

  let weeks = Array.from(buckets.values()).sort((a,b) => a.monday - b.monday);
  if (maxWeeks && weeks.length > maxWeeks) weeks = weeks.slice(-maxWeeks); // últimas N semanas
  weeks.forEach(w => { w.label = weekLabel(w.monday); });

  return { weeks, withoutDate: projects.length - withDate.length };
}

async function storageGet(key){

  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    const r = await window.storage.set(key, JSON.stringify(value), true);
    return !!r;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

        passHash: simpleHash('4dm1nsys'),

      currentUser = { name: u.name, email: u.email, role: u.role || 'user' };

    } else {

  }
}

/* ---------- Sesión persistente (para no deslogear en cada recarga) ---------- */

async function saveSession(email){
  try{ await window.storage.set('sy_dc_session', JSON.stringify({ email }), false); }
  catch(e){ console.error('no se pudo guardar la sesión', e); }
}
async function clearSession(){
  try{ await window.storage.delete('sy_dc_session', false); }
  catch(e){ /* si no existía, no pasa nada */ }
}
async function restoreSession(){
  try{
    const r = await window.storage.get('sy_dc_session', false);
    if (!r) return null;
    const data = JSON.parse(r.value);
    return data && data.email ? data.email : null;
  }catch(e){ return null; }
}

function authLoginView(){
  return `
    <form data-action-submit="do-login" class="auth-form">
      ${authError ? `<div class="auth-error">${esc(authError)}</div>` : ''}
      <label class="field-label">Correo corporativo</label>
      <input class="text-input" type="email" name="email" placeholder="nombre@syntesys.co" required />
      <label class="field-label">Contraseña</label>
      <input class="text-input" type="password" name="password" placeholder="••••••••" required />
      <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
      <div class="auth-links">
      </div>
    </form>
    <p class="auth-hint">Si perdiste tus credenciales, contacta al administrador de la plataforma.</p>
  `;
}

/* ================= APP PRINCIPAL ================= */
function filteredProjects(){
  return projects.filter(p => {
    if (filters.estado.size && !filters.estado.has(p.estado)) return false;
    if (filters.contratista && p.contratista !== filters.contratista) return false;
    if (filters.ciudad && p.ciudad !== filters.ciudad) return false;
    if (filters.coordinador && p.coordinador !== filters.coordinador) return false;
    if (filters.search){
      const s = filters.search.toLowerCase();
      const hay = `${p.cliente||''} ${p.sede||''} ${p.ciudad||''} ${p.nCotizacion||''}`.toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
}

function renderApp(){
  return `
    <div class="app-shell">
      ${renderTopbar()}
      <div class="app-body">
        ${renderTabs()}
        <div class="tab-content">
          ${activeTab==='resumen' ? renderResumen() : ''}
          ${activeTab==='proyectos' ? renderProyectos() : ''}
          ${activeTab==='analisis' ? renderAnalisis() : ''}
          ${activeTab==='auditoria' ? renderAuditoria() : ''}
          ${activeTab==='usuarios' ? renderUsuarios() : ''}
        </div>
      </div>
      ${modalState ? renderModal() : ''}
      ${pendingDeleteId ? renderConfirmDelete() : ''}
      ${userModalState ? renderUserModal() : ''}
      ${pendingDeleteUserEmail ? renderConfirmDeleteUser() : ''}
    </div>
  `;
}

  return `

function renderTabs(){
  const tabs = [
    ['resumen','Resumen'],
    ['proyectos','Proyectos'],
    ['analisis','Análisis'],
    ['auditoria','Auditoría'],
  ];
  if (currentUser.role === 'admin') tabs.push(['usuarios','Usuarios']);
  return `<nav class="tabs">
    ${tabs.map(([k,l])=>`<button class="tab-btn ${activeTab===k?'active':''}" data-action="set-tab" data-tab="${k}">${l}</button>`).join('')}
  </nav>`;
}

/* ----- RESUMEN ----- */
function renderResumen(){
  const total = projects.length;
  const avgAvance = total ? Math.round(projects.reduce((s,p)=>s+computeAvance(p),0)/total) : 0;
  const kpis = STATUSES.map(st => ({ st, count: projects.filter(p=>p.estado===st).length }));

  return `
    <section class="panel">
      <div class="kpi-grid">
        <div class="kpi-card kpi-card-hero">
          <div class="kpi-hero-value">${avgAvance}%</div>
          <div class="kpi-hero-label">Avance promedio de todos los proyectos</div>
          <div class="kpi-hero-sub">${total} proyectos tiendas DC en el sistema</div>
        </div>
        ${kpis.map(k => `
          <div class="kpi-card" style="border-left-color:${STATUS_COLORS[k.st]}">
            <div class="kpi-count">${k.count}</div>
            <div class="kpi-label">${k.st}</div>
          </div>
        `).join('')}
      </div>

      <div class="panel-row">
        <div class="chart-box">
          <h3 class="chart-title">Proyectos por estado</h3>
          <canvas id="chartEstadoResumen" height="220"></canvas>
        </div>
        <div class="chart-box">
          <h3 class="chart-title">Últimas actualizaciones</h3>
          <ul class="mini-log">
            ${changelog.slice(0,8).map(c => `
              <li>
                <span class="mini-log-user">${esc(c.user)}</span>
                <span class="mini-log-text">${esc(c.text)}</span>
                <span class="mini-log-time">${fmtDateTime(c.ts)}</span>
              </li>`).join('') || '<li class="mini-log-empty">Aún no hay cambios registrados.</li>'}
          </ul>
        </div>
      </div>
    </section>
  `;
}

/* ----- PROYECTOS ----- */
function renderProyectos(){
  const list = filteredProjects();
  const contratistas = uniqueValues('contratista');
  const ciudades = uniqueValues('ciudad');
  const coordinadores = uniqueValues('coordinador');

  return `
    <section class="panel">
      <div class="toolbar">
        <div class="toolbar-left">
          <input class="text-input search-input" type="text" placeholder="Buscar cliente, sede, ciudad o cotización..." value="${esc(filters.search)}" data-filter="search" />

  return `

      <input type="${f.type}" name="${f.key}" value="${esc(val)}" />

/* ---------- Gráficos (Chart.js) ---------- */
function destroyCharts(){
  Object.values(charts).forEach(c => { try{ c.destroy(); }catch(e){} });
  charts = {};
}

function buildCharts(){
  destroyCharts();
  const palette = ['#141414','#F6D500','#3B7DD8','#2E9E5B','#E08A2C','#7A5FC0','#1B7F8C','#8c8c86'];

  const elResumen = document.getElementById('chartEstadoResumen');
  if (elResumen){
    charts.estadoResumen = new Chart(elResumen, {
      type:'bar',
      data:{ labels: STATUSES, datasets:[{ data: STATUSES.map(st=>projects.filter(p=>p.estado===st).length), backgroundColor: STATUSES.map(st=>STATUS_COLORS[st]) }] },
      options: baseBarOptions()
    });
  }

  const elEstado = document.getElementById('chartEstado');
  if (elEstado){
    charts.estado = new Chart(elEstado, {
      type:'bar',
      data:{ labels: STATUSES, datasets:[{ data: STATUSES.map(st=>projects.filter(p=>p.estado===st).length), backgroundColor: STATUSES.map(st=>STATUS_COLORS[st]) }] },
      options: baseBarOptions()
    });
  }

  const elTipo = document.getElementById('chartTipoCiudad');
  if (elTipo){
    const tipos = uniqueValues('tipoCiudad');
    charts.tipoCiudad = new Chart(elTipo, {
      type:'doughnut',
      data:{ labels: tipos, datasets:[{ data: tipos.map(t=>projects.filter(p=>p.tipoCiudad===t).length), backgroundColor: tipos.map((_,i)=>palette[i%palette.length]) }] },
      options:{ responsive:true, plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Inter' } } } } }
    });
  }

  const elContratista = document.getElementById('chartContratista');
  if (elContratista){
    const contratistas = uniqueValues('contratista');
    const avgs = contratistas.map(c => {
      const items = projects.filter(p=>p.contratista===c);
      return Math.round(items.reduce((s,p)=>s+computeAvance(p),0)/items.length);
    });
    charts.contratista = new Chart(elContratista, {
      type:'bar',
      data:{ labels: contratistas, datasets:[{ label:'Avance promedio %', data: avgs, backgroundColor:'#F6D500' }] },
      options:{ ...baseBarOptions(), indexAxis:'y' }
    });
  }

  const elItems = document.getElementById('chartItems');
  if (elItems){
    const avgOf = key => Math.round(projects.reduce((s,p)=>s+(Number(p[key])||0),0)/(projects.length||1));
    charts.items = new Chart(elItems, {
      type:'bar',
      data:{ labels:['Tubería','Cableado','Equipos'], datasets:[{ data:[avgOf('tuberia'),avgOf('cableado'),avgOf('equipos')], backgroundColor:['#141414','#F6D500','#3B7DD8'] }] },
      options: baseBarOptions()
    });
  }

  /* ---- Métricas semanales (tab Análisis) ---- */
  const weekData = buildWeeklyBuckets(analisisWeekField, 12);
  const weeks = weekData.weeks;

  const elSemanaEstado = document.getElementById('chartSemanaEstado');
  if (elSemanaEstado && weeks.length){
    charts.semanaEstado = new Chart(elSemanaEstado, {
      type:'bar',
      data:{
        labels: weeks.map(w=>w.label),
        datasets: STATUSES.map(st => ({
          label: st,
          data: weeks.map(w => w.items.filter(p=>p.estado===st).length),
          backgroundColor: STATUS_COLORS[st]
        }))
      },
      options:{
        responsive:true,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Inter' }, boxWidth:12 } } },
        scales:{ x:{ stacked:true }, y:{ stacked:true, beginAtZero:true, ticks:{ precision:0 } } }
      }
    });
  }

  const elSemanaTiendas = document.getElementById('chartSemanaTiendas');
  if (elSemanaTiendas && weeks.length){
    charts.semanaTiendas = new Chart(elSemanaTiendas, {
      type:'bar',
      data:{
        labels: weeks.map(w=>w.label),
        datasets:[{ label:'Tiendas', data: weeks.map(w=>w.items.length), backgroundColor:'#F6D500' }]
      },
      options: baseBarOptions()
    });
  }

  const elSemanaCoord = document.getElementById('chartSemanaCoordinador');
  if (elSemanaCoord && weeks.length){
    const coordTotals = {};
    weeks.forEach(w => w.items.forEach(p => {
      const c = p.coordinador || 'Sin asignar';
      coordTotals[c] = (coordTotals[c]||0) + 1;
    }));
    // Limitar a los coordinadores más activos para mantener el gráfico legible
    const topCoords = Object.entries(coordTotals).sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>x[0]);
    charts.semanaCoordinador = new Chart(elSemanaCoord, {
      type:'bar',
      data:{
        labels: weeks.map(w=>w.label),
        datasets: topCoords.map((c,i) => ({
          label: c,
          data: weeks.map(w => w.items.filter(p => (p.coordinador||'Sin asignar')===c).length),
          backgroundColor: palette[i % palette.length]
        }))
      },
      options:{
        responsive:true,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Inter' }, boxWidth:12 } } },
        scales:{ x:{ stacked:true }, y:{ stacked:true, beginAtZero:true, ticks:{ precision:0 } } }
      }
    });
  }
}

function baseBarOptions(){
  return {
    responsive:true,
    plugins:{ legend:{ display:false } },
    scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }
  };
}

/* ================= MANEJO DE EVENTOS ================= */
root.addEventListener('click', onRootClick);
root.addEventListener('submit', onRootSubmit);
root.addEventListener('change', onRootChange);
root.addEventListener('input', onRootInput);

function onRootClick(e){
  const overlay = e.target.closest('[data-action="close-modal-overlay"], [data-action="cancel-delete"], [data-action="close-user-modal-overlay"], [data-action="cancel-delete-user"]');
  if (overlay && !e.target.closest('[data-stop-close]')){
    const a = overlay.dataset.action;
    if (a === 'close-modal-overlay'){ modalState = null; }
    else if (a === 'cancel-delete'){ pendingDeleteId = null; }
    else if (a === 'close-user-modal-overlay'){ userModalState = null; userActionError=''; }
    else if (a === 'cancel-delete-user'){ pendingDeleteUserEmail = null; }
    render();
    return;
  }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  switch(action){
    case 'show-login': authView='login'; authError=''; render(); break;
    case 'logout': currentUser=null; authView='login'; clearSession(); render(); break;
    case 'set-tab': activeTab = btn.dataset.tab; render(); break;
    case 'open-new-project':
      modalState = { id: null, draft: { id: nextId(), tuberia:0, cableado:0, equipos:0 } };
      render(); break;
    case 'open-edit-project': {
      const p = projects.find(x=>x.id===Number(btn.dataset.id));
      if (p) { modalState = { id: p.id, draft: { ...p } }; render(); }
      break;
    }
    case 'close-modal': modalState = null; render(); break;
    case 'confirm-delete': pendingDeleteId = Number(btn.dataset.id); render(); break;
    case 'cancel-delete': pendingDeleteId = null; render(); break;
    case 'do-delete': doDelete(); break;
    case 'toggle-estado-filter': {
      const st = btn.dataset.status;
      if (filters.estado.has(st)) filters.estado.delete(st); else filters.estado.add(st);
      render(); break;
    }
    case 'clear-filters':
      filters = { estado:new Set(), contratista:'', ciudad:'', coordinador:'', search:'' };
      render(); break;
    case 'export-excel': exportExcel(); break;
    case 'trigger-import': document.getElementById('importFileInput').click(); break;

    case 'open-new-user':
      userActionError = ''; userActionNotice = null;
      userModalState = { mode:'new', draft:{} };
      render(); break;
    case 'open-reset-user':
      userActionError = ''; userActionNotice = null;
      userModalState = { mode:'reset', email: btn.dataset.email, draft:{} };
      render(); break;
    case 'close-user-modal': userModalState = null; userActionError=''; render(); break;
    case 'toggle-user-role': toggleUserRole(btn.dataset.email); break;
    case 'confirm-delete-user': pendingDeleteUserEmail = btn.dataset.email; render(); break;
    case 'cancel-delete-user': pendingDeleteUserEmail = null; render(); break;
    case 'do-delete-user': doDeleteUser(); break;
    case 'dismiss-user-notice': userActionNotice = null; render(); break;
    case 'refresh-analisis': if (!analisisRefreshing) refreshAnalisisData(); break;
  }
}

/* Recarga proyectos/usuarios/auditoría desde el almacenamiento compartido para
   reflejar en el Análisis los cambios cargados por otros usuarios (ediciones,
   importaciones de Excel, etc.) sin necesidad de recargar toda la página. */
async function refreshAnalisisData(){
  analisisRefreshing = true;
  render();
  try{
    const [p, u, c] = await Promise.all([
      storageGet('sy_dc_projects'),
      storageGet('sy_dc_users'),
      storageGet('sy_dc_changelog'),
    ]);
    if (p && Array.isArray(p) && p.length) projects = p;
    if (u && Array.isArray(u) && u.length) users = u;
    if (Array.isArray(c)) changelog = c;
  }catch(e){
    console.error('No se pudo actualizar el análisis', e);
  }
  analisisLastRefresh = new Date().toISOString();
  analisisRefreshing = false;
  render();
}

function onRootChange(e){
  if (e.target.matches('[data-progress-number]')){
    // Al perder el foco, se normaliza el valor tecleado (entero, entre 0 y 100)
    // y se refleja tanto en el slider como en el avance total.
    let val = Math.round(Number(e.target.value));
    if (isNaN(val)) val = 0;
    val = Math.min(100, Math.max(0, val));
    e.target.value = val;
    syncProgressEditor(e.target);
    return;
  }
  const weekSel = e.target.closest('[data-analisis-field]');
  if (weekSel){
    analisisWeekField = weekSel.value;
    render();
    return;
  }
  const sel = e.target.closest('[data-filter]');
  if (sel){
    filters[sel.dataset.filter] = sel.value;
    render();
  }
}

function onRootInput(e){
  if (e.target.matches('[data-filter="search"]')){
    filters.search = e.target.value;
    // live filter without full re-render focus loss: re-render table only via full render but keep caret is non-trivial;
    // for simplicity re-render fully (fields keep typed value since we pass filters.search back into value attr)
    renderProyectosTableOnly();
    return;
  }
  if (e.target.matches('[data-progress-slider], [data-progress-number]')){
    syncProgressEditor(e.target);
    return;
  }
}

/* Mantiene sincronizados el slider y el campo numérico de cada avance
   (tubería/cableado/equipos), y recalcula el avance total consolidado.
   El campo numérico permite escribir un valor exacto en lugar de depender
   únicamente de arrastrar el slider. */
function syncProgressEditor(target){
  const key = target.dataset.progressKey;
  let val = Number(target.value);
  if (isNaN(val)) val = 0;
  val = Math.min(100, Math.max(0, val));

  const slider = document.querySelector(`[data-progress-slider][data-progress-key="${key}"]`);
  const number = document.querySelector(`[data-progress-number][data-progress-key="${key}"]`);

  if (slider && slider !== target) slider.value = val;
  // No se sobrescribe el campo numérico mientras el usuario está escribiendo en él,
  // para no mover el cursor ni "pelear" con lo que está tecleando.
  if (number && number !== target) number.value = val;

  const keys = ['tuberia','cableado','equipos'];
  let total = 0;
  keys.forEach(k => {
    const n = document.querySelector(`[data-progress-number][data-progress-key="${k}"]`);
    total += Math.min(100, Math.max(0, Number(n ? n.value : 0) || 0));
  });
  const avg = Math.round(total / keys.length);
  const fill = document.getElementById('modalAvanceFill');
  const label = document.getElementById('modalAvanceValue');
  if (fill) fill.style.width = avg + '%';
  if (label) label.textContent = avg + '%';
}

function renderProyectosTableOnly(){
  // Lightweight re-render of just the proyectos section content to preserve search input focus.
  const section = root.querySelector('.tab-content');
  if (section && activeTab==='proyectos'){
    const scrollX = window.scrollX, scrollY = window.scrollY;
    section.innerHTML = renderProyectos();
    const importInput = document.getElementById('importFileInput');
    if (importInput) importInput.addEventListener('change', handleImportFile);
    const input = section.querySelector('[data-filter="search"]');
    if (input){
      input.focus();
      const v = input.value; input.value=''; input.value=v;
    }
    window.scrollTo(scrollX, scrollY);
  }
}

function onRootSubmit(e){
  // El formulario de edición/creación de proyecto se maneja aparte porque no
  // usa data-action-submit; hay que interceptarlo ANTES de cualquier return
  // temprano, o el navegador ejecuta el envío nativo del <form> (recarga la
  // página y borra todo el estado en memoria, incluida la sesión).
  if (e.target.id === 'projectForm'){
    e.preventDefault();
    return saveProject(e.target);
  }

  const form = e.target.closest('[data-action-submit]');
  if (!form) return;
  e.preventDefault();
  const action = form.dataset.actionSubmit;
  const fd = new FormData(form);
  if (action === 'do-login') return doLogin(fd);
  if (action === 'do-create-user') return doCreateUser(fd);
  if (action === 'do-reset-user') return doResetUser(fd);
}

/* ---------- Lógica de autenticación ---------- */
function doLogin(fd){
  const email = String(fd.get('email')).trim().toLowerCase();
  const password = String(fd.get('password'));
  const user = users.find(u => u.email.toLowerCase() === email);
  if (!user || user.passHash !== simpleHash(password)){
    authError = 'Correo o contraseña incorrectos.';
    render(); return;
  }
  currentUser = { name: user.name, email: user.email, role: user.role || 'user' };
  authError = '';
  activeTab = 'resumen';
  saveSession(user.email);
  render();
}

/* ---------- Lógica de administración de usuarios ---------- */
async function doCreateUser(fd){
  const name = String(fd.get('name')).trim();
  const email = String(fd.get('email')).trim().toLowerCase();
  const password = String(fd.get('password'));
  const role = String(fd.get('role')) === 'admin' ? 'admin' : 'user';
  if (!name || !email || password.length < 6){
    userActionError = 'Completa todos los campos (contraseña de mínimo 6 caracteres).';
    render(); return;
  }
  if (users.some(u => u.email.toLowerCase() === email)){
    userActionError = 'Ya existe una cuenta registrada con ese correo.';
    render(); return;
  }
  users.push({ name, email, passHash: simpleHash(password), role, createdAt: new Date().toISOString() });
  await persistUsers();
  logChange({ project:'—', text:`Creó el acceso de ${name} (${email}) como ${role==='admin'?'administrador':'usuario'}.` });
  userModalState = null;
  userActionNotice = { title:'Persona creada', code: password, body: `Comparte esta contraseña temporal con ${name} por un canal seguro (no por este medio). Podrá iniciar sesión con ${email}.` };
  render();
}

async function doResetUser(fd){
  const password = String(fd.get('password'));
  if (password.length < 6){
    userActionError = 'La contraseña debe tener al menos 6 caracteres.';
    render(); return;
  }
  const user = users.find(u => u.email === userModalState.email);
  if (user){
    user.passHash = simpleHash(password);
    await persistUsers();
    logChange({ project:'—', text:`Restableció la contraseña de ${user.name} (${user.email}).` });
    userModalState = null;
    userActionNotice = { title:'Contraseña restablecida', code: password, body: `Comparte esta nueva contraseña temporal con ${user.name} por un canal seguro.` };
  } else {
    userModalState = null;
  }
  render();
}

async function toggleUserRole(email){
  const user = users.find(u => u.email === email);
  if (!user) return;
  if (user.role === 'admin' && users.filter(u=>u.role==='admin').length <= 1){
    alert('Debe existir al menos un administrador. Asigna el rol a otra persona antes de quitarlo aquí.');
    return;
  }
  user.role = user.role === 'admin' ? 'user' : 'admin';
  await persistUsers();
  logChange({ project:'—', text:`Cambió el rol de ${user.name} (${user.email}) a ${user.role==='admin'?'administrador':'usuario'}.` });
  if (currentUser && currentUser.email === user.email){
    currentUser.role = user.role;
    if (user.role !== 'admin' && activeTab === 'usuarios') activeTab = 'resumen';
  }
  render();
}

async function doDeleteUser(){
  const user = users.find(u => u.email === pendingDeleteUserEmail);
  if (user){
    if (user.role === 'admin' && users.filter(u=>u.role==='admin').length <= 1){
      alert('No puedes eliminar al único administrador. Crea u otorga el rol de administrador a otra persona primero.');
      pendingDeleteUserEmail = null;
      render(); return;
    }
    const wasCurrentUser = currentUser && currentUser.email === user.email;
    users = users.filter(u => u.email !== pendingDeleteUserEmail);
    await persistUsers();
    logChange({ project:'—', text:`Eliminó el acceso de ${user.name} (${user.email}).` });
    if (wasCurrentUser){
      currentUser = null; authView = 'login';
      await clearSession();
    }
  }
  pendingDeleteUserEmail = null;
  render();
}

/* ---------- Lógica de proyectos ---------- */
async function saveProject(form){
  const fd = new FormData(form);
  const draft = { ...modalState.draft };
  FIELD_GROUPS.forEach(g => g.fields.forEach(f => {
    draft[f.key] = fd.get(f.key) ?? '';
  }));
  ['tuberia','cableado','equipos'].forEach(k => {
    let v = Math.round(Number(fd.get(k)) || 0);
    v = Math.min(100, Math.max(0, v));
    draft[k] = v;
  });
  draft.avance = computeAvance(draft);
  draft.lastModifiedBy = currentUser.name;
  draft.lastModifiedAt = new Date().toISOString();

  const isNew = modalState.id === null;
  const projectLabel = `${draft.cliente||'Proyecto'} — ${draft.sede||''}`;

  if (isNew){
    projects.push(draft);
    logChange({ project: projectLabel, text: 'Creó el proyecto.' });
  } else {
    const idx = projects.findIndex(p => p.id === modalState.id);
    const old = projects[idx];
    const changes = [];
    FIELD_GROUPS.forEach(g => g.fields.forEach(f => {
      if (String(old[f.key]||'') !== String(draft[f.key]||'')){
        changes.push(`${f.label}: "${old[f.key]||'—'}" → "${draft[f.key]||'—'}"`);
      }
    }));
    ['tuberia','cableado','equipos'].forEach(k => {
      if (Number(old[k]||0) !== Number(draft[k]||0)){
        const lbl = k==='tuberia'?'Tubería':k==='cableado'?'Cableado':'Equipos';
        changes.push(`${lbl}: ${old[k]||0}% → ${draft[k]||0}%`);
      }
    });
    projects[idx] = draft;
    if (changes.length){
      logChange({ project: projectLabel, text: changes.join(' · ') });
    }
  }
  await persistProjects();
  modalState = null;
  render();
}

async function doDelete(){
  const p = projects.find(x=>x.id===pendingDeleteId);
  if (p){
    projects = projects.filter(x=>x.id!==pendingDeleteId);
    logChange({ project: `${p.cliente||''} — ${p.sede||''}`, text: 'Eliminó el proyecto.' });
    await persistProjects();
  }
  pendingDeleteId = null;
  render();
}

/* ---------- Exportar / Importar Excel ---------- */
function exportExcel(){
  const rows = projects.map(p => {
    const row = {};
    EXPORT_HEADERS.forEach(([key,label]) => {
      let v = p[key];
      if (['tuberia','cableado','equipos','avance'].includes(key)){
        v = (Number(v)||0)/100;
      }
      if (key === 'lastModifiedAt' && v){
        v = fmtDateTime(v);
      }
      row[label] = v ?? '';
    });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = EXPORT_HEADERS.map(()=>({ wch: 22 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ESTATUS OPERACIONES 2026');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Estatus_Operaciones_DC_${stamp}.xlsx`);
  logChange({ project:'—', text:'Exportó el estado general a Excel.' });
}

function handleImportFile(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const wb = XLSX.read(evt.target.result, { type:'array', cellDates:true });
      const sheetName = wb.SheetNames.includes('ESTATUS OPERACIONES 2026') ? 'ESTATUS OPERACIONES 2026' : wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      const labelToKey = {};
      EXPORT_HEADERS.forEach(([key,label]) => { labelToKey[label] = key; });

      const imported = rows.map((row, i) => {
        const rec = { id: nextId()+i };
        Object.entries(row).forEach(([label,val]) => {
          const key = labelToKey[label];
          if (!key) return;
          if (['tuberia','cableado','equipos','avance'].includes(key)){
            rec[key] = Math.round((Number(val)||0)*100);
          } else if (val instanceof Date){
            rec[key] = val.toISOString().slice(0,10);
          } else {
            rec[key] = val;
          }
        });
        rec.avance = computeAvance(rec);
        rec.lastModifiedBy = rec.lastModifiedBy || currentUser.name;
        rec.lastModifiedAt = new Date().toISOString();
        return rec;
      }).filter(r => r.cliente);

      if (!imported.length){
        alert('No se encontraron filas reconocibles en el archivo. Verifica que corresponda al formato exportado por esta aplicación.');
        return;
      }
      projects = imported;
      persistProjects();
      logChange({ project:'—', text:`Importó ${imported.length} proyectos desde Excel (${file.name}).` });
      render();
    } catch(err){
      console.error(err);
      alert('No fue posible leer el archivo. Verifica que sea un Excel válido exportado desde esta aplicación.');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}
