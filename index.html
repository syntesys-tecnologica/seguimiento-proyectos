<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --black:#141414;
  --charcoal:#2b2b2b;
  --yellow:#F6D500;
  --yellow-dark:#D9BA00;
  --paper:#FAFAF6;
  --white:#ffffff;
  --line:#E4E1D6;
  --muted:#6b6b63;
  --danger:#B3352A;
  --danger-bg:#FBEAE8;
  --success:#2E9E5B;
  --success-bg:#EAF6EE;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:'Inter', -apple-system, sans-serif;
  background:var(--paper);
  color:var(--black);
  -webkit-font-smoothing:antialiased;
}
#root{ min-height:100vh; }
h1,h2,h3{ font-family:'Space Grotesk', 'Inter', sans-serif; margin:0; }
button{ font-family:inherit; cursor:pointer; }
a{ color:var(--black); }

/* ---------- Loading ---------- */
.loading-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  color:var(--muted);
}
.loading-logo{ width:64px; height:64px; object-fit:contain; }

/* ---------- Auth ---------- */
.auth-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    linear-gradient(180deg, var(--black) 0%, var(--black) 220px, var(--paper) 220px);
  padding:24px;
}
.auth-card{
  width:100%; max-width:400px; background:var(--white); border:1px solid var(--line);
  padding:36px 32px 28px; position:relative; margin-top:40px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.18);
}

@media (max-width:480px){
  .auth-screen{ padding:16px; }
  .auth-card{ padding:28px 20px 22px; margin-top:24px; }
}
.auth-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--yellow);
}
.auth-logo{ display:flex; justify-content:center; margin-bottom:8px; margin-top:-64px; }
.auth-logo img{ width:96px; height:96px; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
.auth-title{ font-size:20px; font-weight:700; text-align:center; letter-spacing:-0.01em; }
.auth-subtitle{ text-align:center; color:var(--muted); font-size:13px; margin:6px 0 24px; }
.auth-form{ display:flex; flex-direction:column; gap:4px; }
.field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--charcoal); margin-top:14px; margin-bottom:6px; }
.auth-links{ display:flex; justify-content:space-between; margin-top:16px; font-size:13px; }
.auth-links a{ text-decoration:none; color:var(--charcoal); border-bottom:1px solid var(--line); }
.auth-links a:hover{ color:var(--black); border-color:var(--black); }
.auth-hint{ margin-top:20px; font-size:12px; color:var(--muted); text-align:center; line-height:1.6; }
.auth-note{ font-size:13px; color:var(--muted); line-height:1.5; }
.auth-error{ background:var(--danger-bg); color:var(--danger); font-size:13px; padding:10px 12px; border-left:3px solid var(--danger); margin-bottom:4px; }
.auth-simulated-email{ background:#FFFBE0; border:1px dashed var(--yellow-dark); padding:14px 16px; margin-bottom:16px; }
.auth-simulated-email-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--charcoal); font-weight:700; }
.auth-simulated-email-code{ font-family:'Space Grotesk',monospace; font-size:28px; font-weight:700; letter-spacing:.1em; margin:6px 0; }
.auth-simulated-email p{ font-size:12px; color:var(--muted); margin:6px 0 0; line-height:1.5; }

/* ---------- Inputs / buttons ---------- */
.text-input, select, input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], textarea{
  width:100%; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--black);
  background:var(--white); border:1px solid var(--line); outline:none;
}
.text-input:focus, select:focus, textarea:focus, input:focus{ border-color:var(--black); }
textarea{ resize:vertical; }

.btn{ border:none; padding:10px 18px; font-size:13px; font-weight:600; letter-spacing:.01em; transition:background .15s, color .15s, border-color .15s; }
.btn:disabled{ opacity:.55; cursor:default; pointer-events:none; }
.btn-block{ width:100%; margin-top:20px; }
.btn-primary{ background:var(--black); color:var(--yellow); }
.btn-primary:hover{ background:var(--charcoal); }
.btn-outline{ background:var(--white); color:var(--black); border:1px solid var(--black); }
.btn-outline:hover{ background:var(--black); color:var(--yellow); }
.btn-ghost-yellow{ background:transparent; color:var(--yellow); border:1px solid var(--yellow); }
.btn-ghost-yellow:hover{ background:var(--yellow); color:var(--black); }
.btn-text{ background:transparent; color:var(--charcoal); padding:6px 8px; text-decoration:underline; text-underline-offset:2px; }
.btn-text-danger{ color:var(--danger); }
.btn-danger{ background:var(--danger); color:var(--white); }

/* ---------- App shell ---------- */
.app-shell{ min-height:100vh; display:flex; flex-direction:column; }
.topbar{
  background:var(--black); color:var(--white); display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px; border-bottom:4px solid var(--yellow); flex-wrap:wrap; gap:10px 16px;
}
.topbar-left{ display:flex; align-items:center; gap:14px; min-width:0; }
.topbar-logo{ width:40px; height:40px; object-fit:contain; flex-shrink:0; }
.topbar-title{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.topbar-title-main{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; letter-spacing:.02em; }
.topbar-title-sub{ font-size:11px; color:#c9c9c9; }
.topbar-right{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.topbar-user{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.3; }
.topbar-user-name{ font-size:13px; font-weight:600; }
.topbar-user-email{ font-size:11px; color:#a8a8a8; }

.app-body{ flex:1; max-width:1240px; margin:0 auto; width:100%; padding:0 28px 60px; }

.tabs{ display:flex; gap:4px; margin-top:20px; border-bottom:1px solid var(--line); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab-btn{ background:transparent; border:none; padding:12px 6px; margin-right:22px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap; flex-shrink:0; }
.tab-btn.active{ color:var(--black); border-bottom-color:var(--yellow); }
.tab-btn:hover{ color:var(--black); }

.tab-content{ padding-top:24px; }
.panel{ display:flex; flex-direction:column; gap:24px; }

@media (max-width:640px){
  .topbar{ padding:12px 16px; }
  .topbar-title-main{ font-size:14px; }
  .topbar-right{ width:100%; justify-content:space-between; }
  .topbar-user{ align-items:flex-start; }
  .app-body{ padding:0 14px 40px; }
  .tab-btn{ margin-right:16px; font-size:13px; padding:10px 4px; }
}
@media (max-width:380px){
  .topbar-user-email{ display:none; }
}

/* ---------- KPIs ---------- */
.kpi-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
.kpi-card{
  background:var(--white); border:1px solid var(--line); border-left:4px solid var(--yellow);
  padding:16px 18px;
}
.kpi-card-hero{
  grid-column:span 4; background:var(--black); color:var(--white); border-left:4px solid var(--yellow);
  display:flex; flex-direction:column; gap:2px; padding:22px 24px;
}
.kpi-hero-value{ font-family:'Space Grotesk', sans-serif; font-size:42px; font-weight:700; color:var(--yellow); }
.kpi-hero-eyebrow{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#c9c9c9; margin-bottom:2px; }
.kpi-hero-label{ font-size:14px; font-weight:600; }
.kpi-hero-sub{ font-size:12px; color:#c9c9c9; margin-top:2px; }
.kpi-count{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; }
.kpi-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:4px; }

@media (max-width: 900px){
  .kpi-grid{ grid-template-columns:repeat(2, 1fr); }
  .kpi-card-hero{ grid-column:span 2; }
}
@media (max-width: 480px){
  .kpi-grid{ grid-template-columns:1fr; }
  .kpi-card-hero{ grid-column:span 1; }
  .kpi-hero-value{ font-size:34px; }
}

/* ---------- Panels / charts ---------- */
.panel-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.chart-box{ background:var(--white); border:1px solid var(--line); padding:18px 20px 8px; }
.chart-box-wide{ grid-column:1 / -1; }
.kpi-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media (max-width:860px){ .kpi-row{ grid-template-columns:1fr; } }
.kpi-card{ background:var(--white); border:1px solid var(--line); padding:18px 20px; }
.kpi-card-label{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
.kpi-card-value{ font-family:'Space Grotesk','Inter',sans-serif; font-size:32px; font-weight:700; line-height:1; }
.kpi-card-sub{ margin-top:8px; font-size:13px; color:var(--muted); }
.kpi-delta{ font-weight:700; }
.delta-up{ color:var(--success); }
.delta-down{ color:var(--danger); }
.delta-flat{ color:var(--muted); }
.chart-title{ font-size:14px; font-weight:700; margin-bottom:12px; }
.chart-error{ color:var(--danger); font-size:12px; margin-top:8px; }

/* Contenedores de altura fija para que los gráficos de barras se vean más
   compactos tanto en PC como en móvil (antes crecían con el ancho de la
   pantalla y quedaban demasiado altos). */
.chart-canvas-box{ position:relative; height:220px; }
.chart-canvas-box-lg{ position:relative; height:260px; }
@media (max-width:640px){
  .chart-canvas-box{ height:170px; }
  .chart-canvas-box-lg{ height:200px; }
}

@media (max-width: 900px){
  .panel-row{ grid-template-columns:1fr; }
}

.mini-log{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; max-height:240px; overflow-y:auto; }
.mini-log li{ font-size:12.5px; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); padding-bottom:8px; }
.mini-log-user{ font-weight:700; }
.mini-log-project{ background:#F2F1EA; color:var(--charcoal); font-weight:600; padding:1px 8px; border-radius:10px; font-size:11.5px; }
.mini-log-text{ color:var(--charcoal); flex:1; }
.mini-log-time{ color:var(--muted); font-size:11px; width:100%; }
.mini-log-empty{ color:var(--muted); }

/* ---------- Toolbar / filters ---------- */
.toolbar{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.toolbar-left{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.toolbar-right{ display:flex; gap:10px; }
.search-input{ min-width:260px; }
.toolbar select{ width:auto; min-width:150px; }

@media (max-width:640px){
  .toolbar{ flex-direction:column; align-items:stretch; }
  .toolbar-left, .toolbar-right{ width:100%; }
  .toolbar-right .btn{ width:100%; }
  .search-input{ min-width:0; width:100%; }
  .toolbar select{ flex:1; min-width:0; }
}

.status-chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.status-chip{
  background:var(--white); border:1px solid var(--line); border-left:4px solid var(--chip-color);
  padding:6px 12px; font-size:12px; font-weight:600; color:var(--charcoal);
}
.status-chip.active{ background:var(--black); color:var(--white); border-color:var(--black); border-left:4px solid var(--chip-color); }
.status-chip-count{ color:var(--muted); font-weight:400; }
.status-chip.active .status-chip-count{ color:#bbb; }

/* ---------- Table ---------- */
.table-wrap{ overflow-x:auto; border:1px solid var(--line); background:var(--white); }
.data-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:900px; }
.data-table thead th{
  text-align:left; padding:10px 14px; background:var(--paper); border-bottom:2px solid var(--black);
  font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--charcoal); white-space:nowrap;
}
.data-table tbody td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
.data-table tbody tr:hover{ background:#FDFBEF; }
.cell-strong{ font-weight:700; }
.cell-sub{ color:var(--muted); font-size:12px; }
.cell-actions{ white-space:nowrap; text-align:right; }
.empty-row{ text-align:center; color:var(--muted); padding:32px !important; }
.table-footnote{ font-size:12px; color:var(--muted); margin-top:8px; }

.status-pill{
  display:inline-block; padding:4px 10px; font-size:11px; font-weight:700; color:var(--white);
  background:var(--chip-color); white-space:nowrap;
}

.progress-track{ background:var(--line); height:6px; width:100px; position:relative; overflow:hidden; }
.progress-track-lg{ width:220px; height:10px; }
.progress-fill{ background:var(--yellow-dark); height:100%; }
.progress-label{ font-size:11px; color:var(--muted); display:block; margin-top:3px; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,20,20,.6); display:flex; align-items:flex-start; justify-content:center;
  padding:40px 20px; overflow-y:auto; z-index:50;
}
.modal-card{ background:var(--white); width:100%; max-width:720px; max-height:calc(100vh - 80px); display:flex; flex-direction:column; box-shadow:0 30px 60px rgba(0,0,0,.35); }
.modal-card-sm{ max-width:440px; max-height:none; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line); }
.modal-header h2{ font-size:16px; }
.modal-close{ background:none; border:none; font-size:16px; color:var(--muted); }
.modal-close:hover{ color:var(--black); }
.modal-form{ padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; }
.modal-footer{ display:flex; justify-content:flex-end; gap:10px; padding-top:8px; border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--white); }

@media (max-width:640px){
  .modal-overlay{ padding:0; align-items:flex-end; }
  .modal-card{ max-width:100%; width:100%; max-height:92vh; }
  .modal-card-sm{ max-width:100%; }
  .modal-header{ padding:16px 18px; }
  .modal-form{ padding:16px 18px; }
  .modal-footer{ flex-direction:column-reverse; }
  .modal-footer .btn{ width:100%; }
}

.form-section{ border:none; padding:0; margin:0; }
.form-section legend{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--charcoal); padding:0 0 10px; width:100%; border-bottom:1px solid var(--line); margin-bottom:12px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
.field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
.field-wide{ grid-column:1 / -1; }
.date-field-row{ display:flex; gap:6px; align-items:center; }
.date-field-row input[type="date"]{ flex:1; min-width:0; }
.btn-clear-date{ flex:none; padding:6px 10px; font-size:12px; white-space:nowrap; }

@media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }

.progress-editor{ display:flex; flex-direction:column; gap:14px; }
.progress-editor-row{ display:grid; grid-template-columns:90px 1fr 48px; align-items:center; gap:12px; }
.progress-editor-row label{ font-size:13px; font-weight:600; }
.progress-editor-value{ font-size:13px; font-weight:700; text-align:right; }
.progress-editor-total{ display:grid; grid-template-columns:90px 1fr 48px; align-items:center; gap:12px; padding-top:8px; border-top:1px dashed var(--line); }
.progress-editor-total label{ font-size:13px; font-weight:700; }
input[type=range]{ accent-color:var(--black); }

function simpleHash(str){
  let h = 5381;
  for (let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function esc(s){
  if (s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(v){
  if (!v) return '—';
  if (/^\d{4}-\d{2}-\d{2}/.test(String(v))){
    const [y,m,d] = String(v).slice(0,10).split('-');
    return `${d}/${m}/${y}`;
  }
  return esc(v);
}
function fmtDateTime(v){
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return esc(v);
  return d.toLocaleString('es-CO', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function computeAvance(p){

/* ---------- Utilidades de semanas (para comparativos semana a semana) ---------- */
// Semanas de lunes a domingo, calculadas con la fecha real del navegador.
function parseDateSafe(v){
  if (!v) return null;
  // Las fechas de solo calendario ("2026-08-25") se interpretan como UTC
  // por el motor de JavaScript. En husos horarios negativos como el de
  // Colombia (UTC-5) eso hacía que, al normalizar a medianoche LOCAL, la
  // fecha se corriera un día hacia atrás (una fecha de un lunes terminaba
  // contándose en la semana anterior). Por eso estas fechas se arman aquí
  // manualmente en hora local, y solo se usa el parseo genérico para los
  // campos que sí traen fecha y hora completas (por ejemplo lastModifiedAt).
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v).trim());
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function mondayOf(date){
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay(); // 0=domingo … 6=sábado
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function fmtDayMonth(date){
  return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}`;
}
// Construye N semanas consecutivas (lunes a domingo) terminando en la semana actual.
function buildWeeklyBuckets(weeksBack){
  const thisMonday = mondayOf(new Date());
  const buckets = [];
  for (let i = weeksBack - 1; i >= 0; i--){
    const monday = addDays(thisMonday, -7*i);
    const sunday = addDays(monday, 6);
    buckets.push({
      monday, sunday,
      label: `${fmtDayMonth(monday)}–${fmtDayMonth(sunday)}`,
      isCurrent: i === 0,
    });
  }
  return buckets;
}
// Cuenta, para cada semana, cuántos proyectos tienen una fecha (dateField) dentro de ese rango.
function countByWeek(dateField, buckets){
  return buckets.map(b => projects.filter(p => {
    const d = parseDateSafe(p[dateField]);
    if (!d) return false;
    const dd = new Date(d); dd.setHours(0,0,0,0);
    return dd >= b.monday && dd <= b.sunday;
  }).length);
}

// Devuelve el rango del periodo elegido y el rango, de la misma duración,
// inmediatamente anterior — para poder comparar "esta semana" contra
// "la semana pasada", etc. Para "todos" no hay comparación (devuelve null).
function periodRangeDates(period){
  const now = new Date();
  let days;
  if (period === 'semana') days = 7;
  else if (period === 'quincena') days = 15;
  else if (period === 'mes') days = 30;
  else return null; // 'todos'
  const currentStart = new Date(now); currentStart.setDate(currentStart.getDate() - days);
  const prevStart = new Date(now); prevStart.setDate(prevStart.getDate() - (days*2));
  return { currentStart, currentEnd: now, prevStart, prevEnd: currentStart };
}
// Cuenta, para cada estado, cuántos proyectos tienen lastModifiedAt dentro de [start, end).
function countEstadosInRange(start, end){
  return STATUSES.map(st => projects.filter(p => {
    if (p.estado !== st) return false;
    const d = parseDateSafe(p.lastModifiedAt);
    return d && d >= start && d < end;
  }).length);
}

// Carga perezosa del SDK de Firebase (import dinámico: funciona en un
// <script> normal, sin necesidad de type="module" ni build tools) e inicia
// sesión anónima, requerida por las reglas de seguridad de Firestore que
// se explican en las instrucciones.
let _fbReady = null;
function getFirebase(){
  if (!_fbReady){
    _fbReady = (async () => {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
      const { getFirestore, doc, getDoc, setDoc, deleteDoc } =
        await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
      const { getAuth, signInAnonymously, onAuthStateChanged } =
        await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js');
      const app = initializeApp(FIREBASE_CONFIG);
      const db = getFirestore(app);
      const auth = getAuth(app);
      await new Promise((resolve, reject) => {
        const unsub = onAuthStateChanged(auth, (user) => { if (user){ unsub(); resolve(); } });
        signInAnonymously(auth).catch(reject);
      });
      return { db, doc, getDoc, setDoc, deleteDoc };
    })();
  }
  return _fbReady;
}

// storageGet devuelve { ok, value }. ok:false significa que hubo un error
// real de lectura (red, permisos, etc.) — quien llama a esta función NO debe
// sobrescribir los datos guardados en ese caso — la persona puede reintentar
// manualmente con el botón "Reintentar" que aparece en pantalla.
async function storageGet(key){
  try{
    const { db, doc, getDoc } = await getFirebase();
    const snap = await getDoc(doc(db, 'app_data', key));
    return { ok: true, value: snap.exists() ? JSON.parse(snap.data().value) : null };
  }catch(e){
    console.error('storage get failed', key, e);
    return { ok: false, value: null, error: e };
  }
}
async function storageSet(key, value){
  try{
    const { db, doc, setDoc } = await getFirebase();
    await setDoc(doc(db, 'app_data', key), { value: JSON.stringify(value), updatedAt: new Date().toISOString() });
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

async function loadAll(){
  const [pRes, uRes, cRes] = await Promise.all([
    storageGet('sy_dc_projects'),
    storageGet('sy_dc_users'),

  ]);

  const projectsNeedDecision = !(pRes.value && Array.isArray(pRes.value) && pRes.value.length);
  const usersNeedDecision = !(uRes.value && Array.isArray(uRes.value) && uRes.value.length);
  let alreadyInitialized = false;

    const initRes = await storageGet('sy_dc_initialized');
    alreadyInitialized = initRes.ok && initRes.value === true;
  }

    projects = pRes.value;

      cableado: Math.round((Number(sp.cableado)||0)*100),
      equipos: Math.round((Number(sp.equipos)||0)*100),
      lastModifiedBy: 'Importación inicial',
      lastModifiedAt: new Date().toISOString(),
    }));
    projects.forEach(pr => pr.avance = computeAvance(pr));
    await storageSet('sy_dc_projects', projects);
  }

  let seededDefaults = false;

  if (uRes.value && Array.isArray(uRes.value) && uRes.value.length){
    users = uRes.value;
    // Migración: usuarios creados antes de existir roles quedan como 'user'.
    let migrated = false;
    users.forEach(x => { if (!x.role){ x.role = 'user'; migrated = true; } });
    if (migrated) await storageSet('sy_dc_users', users);
  } else if (!uRes.ok && alreadyInitialized){
    // Falló la lectura y ya sabíamos que había usuarios: NO los reemplazamos
    // por la cuenta admin por defecto. Mantenemos lo que hubiera en memoria
    // (o una lista vacía si es la primera carga de esta pestaña) y avisamos.
    users = users && users.length ? users : [];
    loadError = true;
  } else {
    users = [{
      name: 'Andres Felipe Florez',
      email: 'admin@syntesys.co',
      passHash: simpleHash('Syntesys2026+'),
      role: 'admin',
      createdAt: new Date().toISOString(),
    }];
    await storageSet('sy_dc_users', users);
    seededDefaults = true;
  }

  // La marca de inicialización solo se escribe una vez: cuando de verdad se
  // acaban de sembrar datos por defecto (primer uso real), o cuando ya
  // confirmamos (con éxito) que todavía no existía. Así evitamos una
  // llamada de escritura extra en cada carga normal exitosa.
  if (seededDefaults || (usersNeedDecision && !alreadyInitialized)){
    await storageSet('sy_dc_initialized', true);
  }

  changelog = Array.isArray(cRes.value) ? cRes.value : (cRes.ok ? [] : changelog || []);

  // Restaurar sesión activa (si existe) para que la persona no tenga que
  // volver a iniciar sesión cada vez que la app se recarga.
  const sessionEmail = await restoreSession();
  if (sessionEmail){
    const u = users.find(x => x.email.toLowerCase() === sessionEmail.toLowerCase());
    if (u){
      currentUser = { name: u.name, email: u.email, role: u.role || 'user' };
      activeTab = 'resumen';
    } else {
      await clearSession();
    }
  }
}

async function persistProjects(){ await storageSet('sy_dc_projects', projects); }
async function persistUsers(){ await storageSet('sy_dc_users', users); }
async function persistChangelog(){ await storageSet('sy_dc_changelog', changelog); }

/* ---------- Actualizar (traer cambios hechos por otros usuarios) ---------- */
// A diferencia de loadAll(), esta función NO toca la sesión activa ni la
// pestaña en la que se encuentra la persona: solo vuelve a traer los datos
// compartidos (proyectos, usuarios, historial) desde el almacenamiento.
async function refreshData(){
  if (isRefreshing) return;
  isRefreshing = true;
  render();
  try{
    const [pRes, uRes, cRes] = await Promise.all([
      storageGet('sy_dc_projects'),
      storageGet('sy_dc_users'),
      storageGet('sy_dc_changelog'),
    ]);
    // Igual que en loadAll: si la lectura falló (pRes.ok/uRes.ok === false),
    // NO tocamos projects/users/changelog — así una falla momentánea de red
    // durante la actualización automática nunca borra datos ya cargados.
    if (Array.isArray(pRes.value)) projects = pRes.value;
    if (Array.isArray(uRes.value)) users = uRes.value;
    if (Array.isArray(cRes.value)) changelog = cRes.value;
    loadError = !pRes.ok || !uRes.ok || !cRes.ok;

    // Si el usuario actual fue editado (rol) o eliminado desde otra sesión,
    // reflejarlo aquí también.
    if (currentUser){
      const fresh = users.find(x => x.email.toLowerCase() === currentUser.email.toLowerCase());
      if (fresh){
        currentUser = { name: fresh.name, email: fresh.email, role: fresh.role || 'user' };
        if (currentUser.role !== 'admin' && ADMIN_ONLY_TABS.includes(activeTab)) activeTab = 'resumen';
      } else {
        currentUser = null; authView = 'login';
        await clearSession();
      }
    }
  } finally {
    isRefreshing = false;
    render();
  }
}

/* ---------- Sesión persistente (para no deslogear en cada recarga) ---------- */
// La sesión se guarda en almacenamiento PERSONAL (no compartido) de este
// navegador/usuario, para que cada quien mantenga su propia sesión activa
// aunque la app se vuelva a cargar (por ejemplo al guardar un proyecto,
// crear un usuario, o reabrir la pestaña).
async function saveSession(email){
  try{ localStorage.setItem('sy_dc_session', JSON.stringify({ email })); }
  catch(e){ console.error('no se pudo guardar la sesión', e); }
}
async function clearSession(){
  try{ localStorage.removeItem('sy_dc_session'); }
  catch(e){ /* si no existía, no pasa nada */ }
}
async function restoreSession(){
  try{
    const raw = localStorage.getItem('sy_dc_session');
    if (!raw) return null;
    const data = JSON.parse(raw);
    return data && data.email ? data.email : null;
  }catch(e){ return null; }
}

function logChange(entry){
  changelog.unshift({ ts: new Date().toISOString(), user: currentUser ? currentUser.name : 'Sistema', userEmail: currentUser ? currentUser.email : null, ...entry });
  // El historial ya NO se recorta automáticamente: todos los registros
  // permanecen disponibles para consulta en cualquier momento. Solo se limita
  // a un tope muy alto (20.000 registros) como salvaguarda técnica del
  // almacenamiento, que en uso normal jamás debería alcanzarse. Si en algún
  // momento se quiere "cerrar" un periodo, un administrador puede exportarlo
  // y luego archivarlo manualmente desde la pestaña Auditoría.
  if (changelog.length > 20000) changelog = changelog.slice(0,20000);
  persistChangelog();
}

/* ---------- Render raíz ---------- */
function render(){
  if (!currentUser){
    root.innerHTML = renderAuth();
  } else {
    root.innerHTML = renderApp();
    afterAppRender();
  }
}

function authLoginView(){
  return `

      ${authError ? `<div class="auth-error">${esc(authError)}</div>` : ''}
      <label class="field-label">Correo corporativo</label>
      <input class="text-input" type="email" name="email" placeholder="nombre@syntesys.co" required />
      <label class="field-label">Contraseña</label>
      <input class="text-input" type="password" name="password" placeholder="••••••••" required />
      <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
      <div class="auth-links">
      </div>
    </form>
    <p class="auth-hint">Si perdiste tus credenciales, contacta al administrador de la plataforma.</p>
  `;
}

/* ================= APP PRINCIPAL ================= */
function filteredProjects(){
  return projects.filter(p => {
    if (filters.estado.size && !filters.estado.has(p.estado)) return false;
    if (filters.contratista && p.contratista !== filters.contratista) return false;
    if (filters.ciudad && p.ciudad !== filters.ciudad) return false;
    if (filters.coordinador && p.coordinador !== filters.coordinador) return false;
    if (filters.search){
      const s = filters.search.toLowerCase();
      const hay = `${p.cliente||''} ${p.sede||''} ${p.ciudad||''} ${p.nCotizacion||''}`.toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
}

function renderApp(){
  return `
    <div class="app-shell">
      ${renderTopbar()}
      <div class="app-body">
        ${renderTabs()}
        <div class="tab-content">
          ${loadError ? `
            <div class="auth-error" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px">
              <span>No se pudo confirmar la última información guardada (posible falla de conexión). Para tu seguridad no se sobrescribió ni se borró nada — solo falta volver a intentar.</span>
              <button class="btn btn-text" data-action="retry-load" style="white-space:nowrap">Reintentar</button>
            </div>
          ` : ''}
          ${activeTab==='resumen' ? renderResumen() : ''}
          ${activeTab==='proyectos' ? renderProyectos() : ''}
          ${activeTab==='analisis' ? renderAnalisis() : ''}
          ${activeTab==='auditoria' ? renderAuditoria() : ''}
          ${activeTab==='usuarios' ? renderUsuarios() : ''}
        </div>
      </div>
      ${modalState ? renderModal() : ''}
      ${pendingDeleteId ? renderConfirmDelete() : ''}
      ${userModalState ? renderUserModal() : ''}
      ${pendingDeleteUserEmail ? renderConfirmDeleteUser() : ''}
      ${pendingArchiveAudit ? renderConfirmArchiveAudit() : ''}
    </div>
  `;
}

function renderTabs(){
  const tabs = [
    ['resumen','Resumen'],
    ['proyectos','Proyectos'],
  ];
  // Análisis, Auditoría y Usuarios quedan reservadas al perfil administrador.
  if (currentUser.role === 'admin') tabs.push(['analisis','Análisis'], ['auditoria','Auditoría'], ['usuarios','Usuarios']);
  return `<nav class="tabs">
    ${tabs.map(([k,l])=>`<button class="tab-btn ${activeTab===k?'active':''}" data-action="set-tab" data-tab="${k}">${l}</button>`).join('')}
  </nav>`;
}

/* ----- RESUMEN ----- */
function renderResumen(){
  const total = projects.length;
  const avgAvance = total ? Math.round(projects.reduce((s,p)=>s+computeAvance(p),0)/total) : 0;
  const kpis = STATUSES.map(st => ({ st, count: projects.filter(p=>p.estado===st).length }));

  // Un perfil de usuario (no administrador) solo debe ver en "Últimas
  // actualizaciones" los cambios que él mismo realizó, no los de los demás.
  const visibleChangelog = currentUser.role === 'admin'
    ? changelog
    : changelog.filter(c => c.userEmail ? c.userEmail === currentUser.email : c.user === currentUser.name);

  return `
    <section class="panel">
      <div class="kpi-grid">
        <div class="kpi-card kpi-card-hero">
          <div class="kpi-hero-eyebrow">Avance general de la operación DC</div>
          <div class="kpi-hero-value">${avgAvance}%</div>
          <div class="kpi-hero-label">Promedio de avance de tubería, cableado y equipos en todos los proyectos</div>
          <div class="kpi-hero-sub">${total} proyectos tiendas DC en el sistema</div>
        </div>
        ${kpis.map(k => `
          <div class="kpi-card" style="border-left-color:${STATUS_COLORS[k.st]}">
            <div class="kpi-count">${k.count}</div>
            <div class="kpi-label">${k.st}</div>
          </div>
        `).join('')}
      </div>

      <div class="panel-row">
        <div class="chart-box chart-box-wide">
          <h3 class="chart-title">Últimas actualizaciones</h3>
          <ul class="mini-log">
            ${visibleChangelog.slice(0,8).map(c => `
              <li>
                <span class="mini-log-user">${esc(c.user)}</span>
                ${c.project && c.project !== '—' ? `<span class="mini-log-project">${esc(c.project)}</span>` : ''}
                <span class="mini-log-text">${esc(c.text)}</span>
                <span class="mini-log-time">${fmtDateTime(c.ts)}</span>

/* ----- ANÁLISIS ----- */
function renderAnalisis(){
  const WEEKS_BACK = 8;
  const buckets = buildWeeklyBuckets(WEEKS_BACK);
  const facturadas = countByWeek('fEmisionFactura', buckets);
  const ocRecibida = countByWeek('fRecepcionOC', buckets);
  const recaudadas = countByWeek('fFacturacionRecaudo', buckets);

  const kpi = (label, arr) => {
    const current = arr[arr.length-1];
    const previous = arr[arr.length-2];
    const diff = current - previous;
    const deltaClass = diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : 'delta-flat';
    const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '—';
    const sign = diff > 0 ? '+' : '';
    return `
      <div class="kpi-card">
        <div class="kpi-card-label">${esc(label)} · esta semana</div>
        <div class="kpi-card-value">${current}</div>
        <div class="kpi-card-sub">Semana anterior: ${previous} · <span class="kpi-delta ${deltaClass}">${arrow} ${sign}${diff}</span></div>
      </div>
    `;
  };

  const deltaCell = (arr, i) => {
    if (i === 0) return '<span class="cell-sub">—</span>';
    const diff = arr[i] - arr[i-1];
    const cls = diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : 'delta-flat';
    const sign = diff > 0 ? '+' : '';
    return `<span class="kpi-delta ${cls}">${diff===0 ? '—' : sign+diff}</span>`;
  };

  const weeklyRows = buckets.map((b,i) => `
    <tr${b.isCurrent ? ' style="background:#FDFBEF"' : ''}>
      <td class="cell-strong">${esc(b.label)}${b.isCurrent ? ' <span class="cell-sub">(semana en curso)</span>' : ''}</td>
      <td>${facturadas[i]} ${deltaCell(facturadas,i)}</td>
      <td>${ocRecibida[i]} ${deltaCell(ocRecibida,i)}</td>
      <td>${recaudadas[i]} ${deltaCell(recaudadas,i)}</td>
    </tr>
  `).join('');

  const cityCount = uniqueValues('ciudad').length;
  const cityChartHeight = Math.max(280, cityCount * 26);
  const contratistaCount = uniqueValues('contratista').length;
  const contratistaChartHeight = Math.max(200, contratistaCount * 22);

  return `
    <section class="panel">
      <div>
        <h3 class="chart-title" style="margin-bottom:2px">Comparativo semanal (lunes a domingo)</h3>
        <p class="auth-note" style="margin-bottom:4px">Con base en las fechas reales registradas en cada proyecto: emisión de factura, recepción de OC y facturación de recaudo.</p>
        <p class="auth-note" style="margin-bottom:16px">La <strong>semana en curso</strong> todavía no ha terminado, así que su total puede verse más bajo solo porque faltan días por contar — no lo interpretes todavía como una caída frente a la semana anterior.</p>
        <div class="kpi-row">
          ${kpi('Tiendas facturadas', facturadas)}
          ${kpi('Tiendas con OC recibida', ocRecibida)}
          ${kpi('Tiendas recaudadas', recaudadas)}
        </div>
      </div>

      <div class="panel-row">
        <div class="chart-box chart-box-wide">
          <h3 class="chart-title">Facturación, OC y recaudo — últimas ${WEEKS_BACK} semanas</h3>
          <div class="chart-canvas-box-lg">
            <canvas id="chartSemanal"></canvas>
          </div>
        </div>
      </div>

      <div>
        <h3 class="chart-title" style="margin-bottom:8px">Detalle semana a semana</h3>
        <p class="auth-note" style="margin-bottom:10px">Cada fila es una semana de lunes a domingo. La columna de la derecha de cada dato (▲/▼) compara esa semana contra la inmediatamente anterior; la semana en curso aún está incompleta.</p>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Semana</th><th>Tiendas facturadas</th><th>Tiendas con OC recibida</th><th>Tiendas recaudadas</th></tr></thead>
            <tbody>${weeklyRows}</tbody>
          </table>
        </div>
      </div>

      <div>
        <h3 class="chart-title" style="margin-bottom:2px">Proyectos por estado — periodo actual vs. anterior</h3>
        <p class="auth-note" style="margin-bottom:14px">Con base en la fecha de última actualización de cada proyecto en la aplicación. Compara, para cada estado, cuántos proyectos se actualizaron en el periodo elegido contra el mismo número de días inmediatamente anterior — por ejemplo, esta semana contra la semana pasada. "Todos los estados" muestra el total acumulado, sin comparación.</p>
        <div class="status-chip-row" style="margin-bottom:16px">
          ${ANALISIS_PERIODS.map(p => `
            <button class="status-chip ${analisisPeriod===p.key?'active':''}" style="--chip-color:#F6D500" data-action="set-analisis-period" data-period="${p.key}">
              ${p.label}
            </button>
          `).join('')}
        </div>
      </div>

      <div class="panel-row">
        <div class="chart-box chart-box-wide">
          <div class="chart-canvas-box">
            <canvas id="chartEstado"></canvas>
          </div>
        </div>
      </div>

      <div class="panel-row">
        <div class="chart-box chart-box-wide">
          <h3 class="chart-title">Proyectos por ciudad</h3>
          <p class="auth-note" style="margin-bottom:10px">Total acumulado de proyectos abiertos en cada ciudad (${cityCount} ciudades), para ver dónde ha habido más apertura de tiendas.</p>
          <div style="height:${cityChartHeight}px">
            <canvas id="chartCiudad"></canvas>
          </div>
        </div>
      </div>

      <div class="panel-row">
        <div class="chart-box chart-box-wide">
          <h3 class="chart-title">Proyectos por contratista (cantidad)</h3>
          <p class="auth-note" style="margin-bottom:10px">Total acumulado de proyectos que ha desarrollado cada contratista.</p>
          <div style="height:${contratistaChartHeight}px">
            <canvas id="chartContratistaCount"></canvas>
          </div>
        </div>
      </div>
    </section>
  `;
}

function renderField(f, d){
  const val = d[f.key] ?? '';
  if (f.type === 'select'){
    return `
      <div class="field">
        <label>${f.label}</label>
        <select name="${f.key}">
          <option value="">—</option>
          ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
      </div>`;
  }
  if (f.type === 'textarea'){
    return `
      <div class="field field-wide">
        <label>${f.label}</label>
        <textarea name="${f.key}" rows="3">${esc(val)}</textarea>
      </div>`;
  }
  if (f.type === 'date'){
    return `
      <div class="field">
        <label>${f.label}</label>
        <div class="date-field-row">
          <input type="date" name="${f.key}" value="${esc(val)}" />
          <button type="button" class="btn btn-text btn-clear-date" data-action="clear-date" data-target="${f.key}" title="Borrar fecha">Borrar</button>
        </div>
      </div>`;
  }
  return `
    <div class="field">
      <label>${f.label}</label>
      <input type="${f.type}" name="${f.key}" value="${esc(val)}" />
    </div>`;
}

function destroyCharts(){
  Object.values(charts).forEach(c => { try{ c.destroy(); }catch(e){} });
  charts = {};
}

function buildCharts(){
  destroyCharts();
  // Si por cualquier motivo la librería de gráficos no cargó (por ejemplo, sin
  // conexión a internet o un bloqueo de red), lo mostramos de forma visible en
  // cada recuadro en vez de dejarlo en blanco sin explicación.
  function safeChart(el, key, config){
    if (!el) return;
    try{
      if (typeof Chart === 'undefined') throw new Error('Chart.js no está disponible');
      charts[key] = new Chart(el, config);
    }catch(err){
      console.error('No se pudo dibujar el gráfico', key, err);
      const box = el.closest('.chart-box');
      if (box && !box.querySelector('.chart-error')){
        const msg = document.createElement('p');
        msg.className = 'chart-error';
        msg.textContent = 'No se pudo cargar la librería de gráficos. Revisa tu conexión a internet y actualiza la página.';
        box.appendChild(msg);
      }
    }
  }

  const elSemanal = document.getElementById('chartSemanal');
  if (elSemanal){
    const WEEKS_BACK = 8;
    const buckets = buildWeeklyBuckets(WEEKS_BACK);
    safeChart(elSemanal, 'semanal', {
      type:'bar',
      data:{
        labels: buckets.map(b=>b.label),
        datasets:[
          { label:'Facturadas', data: countByWeek('fEmisionFactura', buckets), backgroundColor:'#7A5FC0' },
          { label:'OC recibida', data: countByWeek('fRecepcionOC', buckets), backgroundColor:'#E08A2C' },
          { label:'Recaudadas', data: countByWeek('fFacturacionRecaudo', buckets), backgroundColor:'#141414' },
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Inter' } } } },
        scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }
      }
    });
  }

  const elEstado = document.getElementById('chartEstado');
  if (elEstado){
    const range = periodRangeDates(analisisPeriod);
    if (!range){
      // "Todos los estados": total acumulado, sin comparación de periodo.
      safeChart(elEstado, 'estado', {
        type:'bar',
        data:{ labels: STATUSES, datasets:[{ label:'Total', data: STATUSES.map(st=>projects.filter(p=>p.estado===st).length), backgroundColor: STATUSES.map(st=>STATUS_COLORS[st]) }] },
        options: { ...baseBarOptions(), maintainAspectRatio:false }
      });
    } else {
      const current = countEstadosInRange(range.currentStart, range.currentEnd);
      const previous = countEstadosInRange(range.prevStart, range.prevEnd);
      safeChart(elEstado, 'estado', {
        type:'bar',
        data:{
          labels: STATUSES,
          datasets:[
            { label:'Este periodo', data: current, backgroundColor:'#F6D500' },
            { label:'Periodo anterior', data: previous, backgroundColor:'#8c8c86' },
          ]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{ family:'Inter' } } } },
          scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }
        }
      });
    }
  }

  // Ciudad y contratista: totales ACUMULADOS de todos los proyectos (no se
  // filtran por el selector de periodo), ordenados de mayor a menor cantidad.
  // El de ciudad se dibuja horizontal y dentro de un contenedor cuya altura
  // ya se calculó en renderAnalisis() según el número de ciudades, para que
  // todas queden visibles sin apretarse ni recortarse.
  const elCiudad = document.getElementById('chartCiudad');
  if (elCiudad){
    const ciudades = uniqueValues('ciudad');
    const paired = ciudades
      .map(c => ({ c, n: projects.filter(p=>p.ciudad===c).length }))
      .sort((a,b) => b.n - a.n);
    safeChart(elCiudad, 'ciudad', {
      type:'bar',
      data:{ labels: paired.map(p=>p.c), datasets:[{ label:'Proyectos', data: paired.map(p=>p.n), backgroundColor:'#3B7DD8' }] },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        indexAxis:'y',
        plugins:{ legend:{ display:false } },
        scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } }
      }
    });
  }

  const elContratistaCount = document.getElementById('chartContratistaCount');
  if (elContratistaCount){
    const contratistas = uniqueValues('contratista');
    const paired = contratistas
      .map(c => ({ c, n: projects.filter(p=>p.contratista===c).length }))
      .sort((a,b) => b.n - a.n);
    safeChart(elContratistaCount, 'contratistaCount', {
      type:'bar',
      data:{ labels: paired.map(p=>p.c), datasets:[{ label:'Proyectos', data: paired.map(p=>p.n), backgroundColor:'#7A5FC0' }] },
      options:{ ...baseBarOptions(), maintainAspectRatio:false, indexAxis:'y' }
    });
  }
}

function baseBarOptions(){
  return {
    responsive:true,
    plugins:{ legend:{ display:false } },
    scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }
  };
}

/* ---------- Ciclo tras render ---------- */
function afterAppRender(){
  if (activeTab === 'resumen' || activeTab === 'analisis'){
    requestAnimationFrame(buildCharts);
  }
}

/* ================= MANEJO DE EVENTOS ================= */
root.addEventListener('click', onRootClick);
root.addEventListener('submit', onRootSubmit);
root.addEventListener('change', onRootChange);
root.addEventListener('input', onRootInput);

function onRootClick(e){
  const overlay = e.target.closest('[data-action="close-modal-overlay"], [data-action="cancel-delete"], [data-action="close-user-modal-overlay"], [data-action="cancel-delete-user"], [data-action="cancel-archive-audit"]');
  if (overlay && !e.target.closest('[data-stop-close]')){
    const a = overlay.dataset.action;
    if (a === 'close-modal-overlay'){ modalState = null; }
    else if (a === 'cancel-delete'){ pendingDeleteId = null; }
    else if (a === 'close-user-modal-overlay'){ userModalState = null; userActionError=''; }
    else if (a === 'cancel-delete-user'){ pendingDeleteUserEmail = null; }
    else if (a === 'cancel-archive-audit'){ pendingArchiveAudit = false; }
    render();
    return;
  }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  switch(action){
    case 'clear-date': {
      const input = btn.parentElement.querySelector(`input[name="${btn.dataset.target}"]`);
      if (input){
        input.value = '';
        // Disparamos estos eventos manualmente porque algunos navegadores no
        // consideran "confirmado" un input type="date" vaciado solo por JS
        // hasta que recibe un evento input/change — sin esto, el valor viejo
        // podía reaparecer al guardar si el campo no perdía el foco antes.
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        input.focus();
      }
      return;
    }
    case 'show-login': authView='login'; authError=''; render(); break;
    case 'refresh-data': refreshData(); break;
    case 'open-change-password':
      userActionError = ''; userActionNotice = null;
      userModalState = { mode:'self', email: currentUser.email, draft:{} };
      render(); break;
    case 'logout':
      if (confirm('¿Estás seguro de que deseas salir de la aplicación?')) {
        currentUser=null; authView='login'; clearSession(); render();
      }
      break;
    case 'retry-load': refreshData(); break;
    case 'set-tab': activeTab = btn.dataset.tab; render(); break;
    case 'open-new-project':
      modalState = { id: null, draft: { id: nextId(), tuberia:0, cableado:0, equipos:0 } };
      render(); break;
    case 'open-edit-project': {
      const p = projects.find(x=>x.id===Number(btn.dataset.id));
      if (p) { modalState = { id: p.id, draft: { ...p } }; render(); }
      break;
    }
    case 'close-modal': modalState = null; render(); break;
    case 'confirm-delete': pendingDeleteId = Number(btn.dataset.id); render(); break;
    case 'cancel-delete': pendingDeleteId = null; render(); break;
    case 'do-delete': doDelete(); break;
    case 'toggle-estado-filter': {
      const st = btn.dataset.status;
      if (filters.estado.has(st)) filters.estado.delete(st); else filters.estado.add(st);
      render(); break;
    }
    case 'set-analisis-period': analisisPeriod = btn.dataset.period; render(); break;
    case 'clear-filters':
      filters = { estado:new Set(), contratista:'', ciudad:'', coordinador:'', search:'' };
      render(); break;
    case 'export-excel': exportExcel(); break;
    case 'export-audit': exportAuditLog(); break;
    case 'confirm-archive-audit': pendingArchiveAudit = true; render(); break;
    case 'cancel-archive-audit': pendingArchiveAudit = false; render(); break;
    case 'do-archive-audit': doArchiveAudit(); break;

    case 'open-new-user':
      userActionError = ''; userActionNotice = null;
      userModalState = { mode:'new', draft:{} };
      render(); break;
    case 'open-reset-user':
      userActionError = ''; userActionNotice = null;
      userModalState = { mode:'reset', email: btn.dataset.email, draft:{} };
      render(); break;
    case 'open-edit-user':
      userActionError = ''; userActionNotice = null;
      userModalState = { mode:'edit', email: btn.dataset.email, draft:{} };
      render(); break;
    case 'close-user-modal': userModalState = null; userActionError=''; render(); break;
    case 'toggle-user-role': toggleUserRole(btn.dataset.email); break;
    case 'confirm-delete-user': pendingDeleteUserEmail = btn.dataset.email; render(); break;
    case 'cancel-delete-user': pendingDeleteUserEmail = null; render(); break;
    case 'do-delete-user': doDeleteUser(); break;
    case 'dismiss-user-notice': userActionNotice = null; render(); break;
  }
}

function onRootChange(e){
  const sel = e.target.closest('[data-filter]');
  if (sel){
    filters[sel.dataset.filter] = sel.value;
    render();
  }
}

function onRootInput(e){
  if (e.target.matches('[data-filter="search"]')){
    filters.search = e.target.value;
    // live filter without full re-render focus loss: re-render table only via full render but keep caret is non-trivial;
    // for simplicity re-render fully (fields keep typed value since we pass filters.search back into value attr)
    renderProyectosTableOnly();
    return;
  }
  if (e.target.matches('[data-progress-slider]')){
    const name = e.target.name;
    const valSpan = document.querySelector(`[data-progress-value-for="${name}"]`);
    if (valSpan) valSpan.textContent = e.target.value + '%';
    const sliders = document.querySelectorAll('[data-progress-slider]');
    let total = 0;
    sliders.forEach(s => total += Number(s.value));
    const avg = Math.round(total / sliders.length);
    const fill = document.getElementById('modalAvanceFill');
    const label = document.getElementById('modalAvanceValue');
    if (fill) fill.style.width = avg + '%';
    if (label) label.textContent = avg + '%';
  }
}

function renderProyectosTableOnly(){
  // Lightweight re-render of just the proyectos section content to preserve search input focus.
  const section = root.querySelector('.tab-content');
  if (section && activeTab==='proyectos'){
    const scrollX = window.scrollX, scrollY = window.scrollY;
    section.innerHTML = renderProyectos();
    const input = section.querySelector('[data-filter="search"]');
    if (input){
      input.focus();
      const v = input.value; input.value=''; input.value=v;
    }
    window.scrollTo(scrollX, scrollY);
  }
}

function onRootSubmit(e){
  // El formulario de proyecto no lleva data-action-submit, así que se resuelve aparte
  // y SIEMPRE se llama a preventDefault() antes de cualquier salida — de lo contrario
  // el navegador llega a enviar el formulario de forma nativa (recarga la página) y
  // se pierde toda la sesión en memoria, lo que se sentía como un "deslogueo" al guardar.
  if (e.target && e.target.id === 'projectForm'){
    e.preventDefault();
    return saveProject(e.target);
  }
  const form = e.target.closest('[data-action-submit]');
  if (!form) return;
  e.preventDefault();
  const action = form.dataset.actionSubmit;
  const fd = new FormData(form);
  if (action === 'do-login') return doLogin(fd);
  if (action === 'do-create-user') return doCreateUser(fd);
  if (action === 'do-reset-user') return doResetUser(fd);
  if (action === 'do-edit-user') return doEditUser(fd);
  if (action === 'do-change-own-password') return doChangeOwnPassword(fd);
}

/* ---------- Lógica de autenticación ---------- */
function doLogin(fd){
  const email = String(fd.get('email')).trim().toLowerCase();
  const password = String(fd.get('password'));
  const user = users.find(u => u.email.toLowerCase() === email);
  if (!user || user.passHash !== simpleHash(password)){
    authError = 'Correo o contraseña incorrectos.';
    render(); return;
  }
  currentUser = { name: user.name, email: user.email, role: user.role || 'user' };
  authError = '';
  activeTab = 'resumen';
  saveSession(user.email);
  render();
}

/* ---------- Lógica de administración de usuarios ---------- */
async function doCreateUser(fd){
  const name = String(fd.get('name')).trim();
  const email = String(fd.get('email')).trim().toLowerCase();
  const password = String(fd.get('password'));
  const role = String(fd.get('role')) === 'admin' ? 'admin' : 'user';
  if (!name || !email || password.length < 6){
    userActionError = 'Completa todos los campos (contraseña de mínimo 6 caracteres).';
    render(); return;
  }
  if (users.some(u => u.email.toLowerCase() === email)){
    userActionError = 'Ya existe una cuenta registrada con ese correo.';
    render(); return;
  }
  users.push({ name, email, passHash: simpleHash(password), role, createdAt: new Date().toISOString() });
  await persistUsers();
  logChange({ project:'—', text:`Creó el acceso de ${name} (${email}) como ${role==='admin'?'administrador':'usuario'}.` });
  userModalState = null;
  userActionNotice = { title:'Persona creada', code: password, body: `Comparte esta contraseña temporal con ${name} por un canal seguro (no por este medio). Podrá iniciar sesión con ${email}.` };
  render();
}

async function doResetUser(fd){
  const password = String(fd.get('password'));
  if (password.length < 6){
    userActionError = 'La contraseña debe tener al menos 6 caracteres.';
    render(); return;
  }
  const user = users.find(u => u.email === userModalState.email);
  if (user){
    user.passHash = simpleHash(password);
    await persistUsers();
    logChange({ project:'—', text:`Restableció la contraseña de ${user.name} (${user.email}).` });
    userModalState = null;
    userActionNotice = { title:'Contraseña restablecida', code: password, body: `Comparte esta nueva contraseña temporal con ${user.name} por un canal seguro.` };
  } else {
    userModalState = null;
  }
  render();
}

async function doEditUser(fd){
  const name = String(fd.get('name')).trim();
  const email = String(fd.get('email')).trim().toLowerCase();
  if (!name || !email){
    userActionError = 'Completa el nombre y el correo.';
    render(); return;
  }
  const user = users.find(u => u.email === userModalState.email);
  if (!user){
    userModalState = null; render(); return;
  }
  const emailTaken = users.some(u => u !== user && u.email.toLowerCase() === email);
  if (emailTaken){
    userActionError = 'Ya existe otra cuenta registrada con ese correo.';
    render(); return;
  }

  const oldName = user.name, oldEmail = user.email;
  user.name = name;
  user.email = email;
  await persistUsers();

  const changes = [];
  if (oldName !== name) changes.push(`nombre: "${oldName}" → "${name}"`);
  if (oldEmail.toLowerCase() !== email) changes.push(`correo: "${oldEmail}" → "${email}"`);
  logChange({ project:'—', text: changes.length ? `Editó a ${oldName}: ${changes.join(' · ')}.` : `Editó a ${oldName} sin cambios.` });

  // Si la persona se editó a sí misma, actualizamos su sesión activa y la
  // clave con la que se guarda su sesión persistente para que no se le
  // cierre la sesión ni pierda el acceso.
  if (currentUser && currentUser.email.toLowerCase() === oldEmail.toLowerCase()){
    currentUser = { name: user.name, email: user.email, role: user.role || 'user' };
    await saveSession(user.email);
  }

  userModalState = null;
  render();
}

// Permite que cualquier persona (usuario o administrador) cambie la
// contraseña con la que inició sesión, sin depender de un administrador.
async function doChangeOwnPassword(fd){
  const currentPassword = String(fd.get('currentPassword'));
  const newPassword = String(fd.get('newPassword'));
  const user = users.find(u => u.email === currentUser.email);
  if (!user){ userModalState = null; render(); return; }
  if (user.passHash !== simpleHash(currentPassword)){
    userActionError = 'La contraseña actual no es correcta.';
    render(); return;
  }
  if (newPassword.length < 6){
    userActionError = 'La nueva contraseña debe tener al menos 6 caracteres.';
    render(); return;
  }
  user.passHash = simpleHash(newPassword);
  await persistUsers();
  logChange({ project:'—', text:'Cambió su propia contraseña.' });
  userModalState = null;
  render();
  alert('Tu contraseña se actualizó correctamente.');
}

async function toggleUserRole(email){
  const user = users.find(u => u.email === email);
  if (!user) return;
  if (user.role === 'admin' && users.filter(u=>u.role==='admin').length <= 1){
    alert('Debe existir al menos un administrador. Asigna el rol a otra persona antes de quitarlo aquí.');
    return;
  }
  user.role = user.role === 'admin' ? 'user' : 'admin';
  await persistUsers();
  logChange({ project:'—', text:`Cambió el rol de ${user.name} (${user.email}) a ${user.role==='admin'?'administrador':'usuario'}.` });
  if (currentUser && currentUser.email === user.email){
    currentUser.role = user.role;
    if (user.role !== 'admin' && ADMIN_ONLY_TABS.includes(activeTab)) activeTab = 'resumen';
  }
  render();
}

async function doDeleteUser(){
  const user = users.find(u => u.email === pendingDeleteUserEmail);
  if (user){
    if (user.role === 'admin' && users.filter(u=>u.role==='admin').length <= 1){
      alert('No puedes eliminar al único administrador. Crea u otorga el rol de administrador a otra persona primero.');
      pendingDeleteUserEmail = null;
      render(); return;
    }
    const wasCurrentUser = currentUser && currentUser.email === user.email;
    users = users.filter(u => u.email !== pendingDeleteUserEmail);
    await persistUsers();
    logChange({ project:'—', text:`Eliminó el acceso de ${user.name} (${user.email}).` });
    if (wasCurrentUser){
      currentUser = null; authView = 'login';
      await clearSession();
    }
  }
  pendingDeleteUserEmail = null;
  render();
}

/* ---------- Lógica de proyectos ---------- */
async function saveProject(form){
  const fd = new FormData(form);
  const draft = { ...modalState.draft };
  FIELD_GROUPS.forEach(g => g.fields.forEach(f => {
    draft[f.key] = fd.get(f.key) ?? '';
  }));
  ['tuberia','cableado','equipos'].forEach(k => { draft[k] = Number(fd.get(k))||0; });
  draft.avance = computeAvance(draft);
  draft.lastModifiedBy = currentUser.name;
  draft.lastModifiedAt = new Date().toISOString();

  const isNew = modalState.id === null;
  const projectLabel = `${draft.cliente||'Proyecto'} — ${draft.sede||''}`;

  if (isNew){
    projects.push(draft);
    logChange({ project: projectLabel, text: 'Creó el proyecto.' });
  } else {
    const idx = projects.findIndex(p => p.id === modalState.id);
    const old = projects[idx];
    const changes = [];
    FIELD_GROUPS.forEach(g => g.fields.forEach(f => {
      if (String(old[f.key]||'') !== String(draft[f.key]||'')){
        changes.push(`${f.label}: "${old[f.key]||'—'}" → "${draft[f.key]||'—'}"`);
      }
    }));
    ['tuberia','cableado','equipos'].forEach(k => {
      if (Number(old[k]||0) !== Number(draft[k]||0)){
        const lbl = k==='tuberia'?'Tubería':k==='cableado'?'Cableado':'Equipos';
        changes.push(`${lbl}: ${old[k]||0}% → ${draft[k]||0}%`);
      }
    });
    projects[idx] = draft;
    if (changes.length){
      logChange({ project: projectLabel, text: changes.join(' · ') });
    }
  }
  await persistProjects();
  modalState = null;
  render();
}

async function doDelete(){
  const p = projects.find(x=>x.id===pendingDeleteId);
  if (p){
    projects = projects.filter(x=>x.id!==pendingDeleteId);
    logChange({ project: `${p.cliente||''} — ${p.sede||''}`, text: 'Eliminó el proyecto.' });
    await persistProjects();
  }
  pendingDeleteId = null;
  render();
}

/* ---------- Exportar / Importar Excel ---------- */
function exportExcel(){
  const rows = projects.map(p => {
    const row = {};
    EXPORT_HEADERS.forEach(([key,label]) => {
      let v = p[key];
      if (['tuberia','cableado','equipos','avance'].includes(key)){
        v = (Number(v)||0)/100;
      }
      if (key === 'lastModifiedAt' && v){
        v = fmtDateTime(v);
      }
      row[label] = v ?? '';
    });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = EXPORT_HEADERS.map(()=>({ wch: 22 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ESTATUS OPERACIONES 2026');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Estatus_Operaciones_DC_${stamp}.xlsx`);
  logChange({ project:'—', text:'Exportó el estado general a Excel.' });
}

/* ---------- Auditoría: exportar y archivar ---------- */
function buildAuditWorkbook(){
  const rows = changelog.map(c => ({
    'FECHA': fmtDateTime(c.ts),
    'USUARIO': c.user || '',
    'PROYECTO': c.project || '',
    'CAMBIO': c.text || '',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch:20 },{ wch:26 },{ wch:32 },{ wch:70 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'AUDITORIA');
  return wb;
}

function exportAuditLog(){
  if (!changelog.length){
    alert('Todavía no hay registros de auditoría para exportar.');
    return;
  }
  const wb = buildAuditWorkbook();
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Auditoria_Proyectos_DC_${stamp}.xlsx`);
}

async function doArchiveAudit(){
  const wb = buildAuditWorkbook();
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Auditoria_Proyectos_DC_${stamp}.xlsx`);

  const archivedCount = changelog.length;
  const archivedByLabel = currentUser.name;
  changelog = [{
    ts: new Date().toISOString(),
    user: archivedByLabel,
    project: '—',
    text: `Archivó y reinició el historial (${archivedCount} registro(s) exportados a Excel antes de reiniciar).`,
  }];
  await persistChangelog();
  pendingArchiveAudit = false;
  render();
}

/* ---------- Actualización automática silenciosa (cada 30s) ---------- */
// A diferencia del botón "Actualizar" (que muestra "Actualizando…" y es una
// acción explícita), esta corre sola en segundo plano cada 30 segundos.
// Para que NO afecte a la persona mientras trabaja, se salta por completo si:
//   - hay un modal abierto (editando un proyecto, un usuario, o confirmando
//     una eliminación) — no queremos pisarle lo que está a mitad de llenar.
//   - tiene el foco puesto en un campo de texto, select o buscador — para no
//     interrumpirle mientras escribe o filtra.
// Además conserva la posición del scroll para que la pantalla no salte.
let autoRefreshTimer = null;
function isUserCurrentlyEditing(){
  if (modalState || userModalState || pendingDeleteId || pendingDeleteUserEmail) return true;
  const el = document.activeElement;

async function silentAutoRefresh(){
  if (isRefreshing || !currentUser || isUserCurrentlyEditing()) return;
  isRefreshing = true;
  try{
    const [pRes, uRes, cRes] = await Promise.all([
      storageGet('sy_dc_projects'),
      storageGet('sy_dc_users'),
      storageGet('sy_dc_changelog'),
    ]);
    // Solo sobrescribimos si la lectura trajo datos reales; si falló, se
    // conserva lo que ya había en memoria (nunca se borra por una falla).
    if (Array.isArray(pRes.value)) projects = pRes.value;
    if (Array.isArray(uRes.value)) users = uRes.value;
    if (Array.isArray(cRes.value)) changelog = cRes.value;

    if (currentUser){
      const fresh = users.find(x => x.email.toLowerCase() === currentUser.email.toLowerCase());
      if (fresh){
        currentUser = { name: fresh.name, email: fresh.email, role: fresh.role || 'user' };
        if (currentUser.role !== 'admin' && ADMIN_ONLY_TABS.includes(activeTab)) activeTab = 'resumen';
      } else {
        currentUser = null; authView = 'login';
        await clearSession();
      }
    }

    // Justo antes de pintar de nuevo, volvemos a comprobar que la persona no
    // se puso a editar algo mientras esperábamos la respuesta del servidor.
    if (isUserCurrentlyEditing()) return;
    const scrollX = window.scrollX, scrollY = window.scrollY;
    render();
    window.scrollTo(scrollX, scrollY);
  } finally {
    isRefreshing = false;
  }
}
function startAutoRefresh(){
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(silentAutoRefresh, 30000);
}
